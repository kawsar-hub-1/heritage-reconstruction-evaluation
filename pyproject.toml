[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-reconstruction-evaluation"
version = "0.1.0"
description = "Research software for computational and expert-informed evaluation of AI-assisted cultural heritage reconstructions."
requires-python = ">=3.10"
authors = [{name = "Kawsar Arzomand"}]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "openpyxl>=3.1",
]

[project.scripts]
heritage-eval = "heritage_eval.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
